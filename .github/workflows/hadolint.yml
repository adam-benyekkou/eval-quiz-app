name: Hadolint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfiles
        run: |
          files=$(find . -not -path "./node_modules/*" -not -path "./.git/*" -iname "Dockerfile*")
          if [ -z "$files" ]; then
            echo "No Dockerfile found, skipping."
            exit 0
          fi
          status=0
          for f in $files; do
            echo "::group::Linting $f"
            docker run --rm -i hadolint/hadolint < "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
