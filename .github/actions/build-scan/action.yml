name: Build and scan image
description: >
  Construit une image Docker en local puis la scanne avec Trivy.
  Une vulnérabilité CRITICAL (corrigée ou non) fait échouer l'étape.
  Rien n'est poussé : le push reste à la charge de l'appelant, après le scan.

inputs:
  image:
    description: Référence complète de l'image (nom:tag)
    required: true
  context:
    description: Contexte de build
    required: true
  dockerfile:
    description: Chemin du Dockerfile
    required: true
  cache-scope:
    description: Nom du cache GitHub Actions
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ${{ inputs.image }}
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        load: true
        tags: ${{ inputs.image }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}

    # ignore-unfixed reste à false : un CRITICAL sans correctif publié doit aussi
    # bloquer et être arbitré à la main, pas être masqué.
    - name: Trivy ${{ inputs.image }} (CRITICAL bloquant)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        scanners: vuln
        format: table
        severity: CRITICAL
        ignore-unfixed: false
        exit-code: 1
