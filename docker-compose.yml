services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Données persistantes : survivent à `docker compose down`, pas à `down -v`
      - pgdata:/var/lib/postgresql/data
      # Schéma joué uniquement au premier démarrage sur un volume vide
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build: ./backend
    image: quiz-backend:local
    environment:
      PORT: 3007
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: .
    image: quiz-frontend:local
    ports:
      # Seul port publié : 8087 sur l'hôte -> 8080 (nginx non-root)
      - "8087:8080"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 3007
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
