name: CI images

# Pull request : construit chaque image puis la scanne avec Trivy
# (action partagée .github/actions/build-scan). CRITICAL bloque.
# trivy.yml scanne le système de fichiers, hadolint.yml lint les Dockerfiles.
# Aucun secret, aucun déploiement : la CD (cd.yml) ne tourne qu'après fusion.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quiz-backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: quiz-frontend
            context: .
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and scan ${{ matrix.image }}
        uses: ./.github/actions/build-scan
        with:
          image: ${{ matrix.image }}:ci
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          cache-scope: ${{ matrix.image }}
