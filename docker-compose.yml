services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copier .env.example en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copier .env.example en .env}
      POSTGRES_DB: ${POSTGRES_DB:?copier .env.example en .env}
    volumes:
      # Données persistantes : survivent à `docker compose down`, pas à `down -v`
      - pgdata:/var/lib/postgresql/data
      # Schéma joué uniquement au premier démarrage sur un volume vide
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build: ./backend
    image: quiz-backend:local
    # Écoute sur 3007 par défaut (backend/server.js) : pas de PORT à fournir.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RESEND_API_KEY: ${RESEND_API_KEY:?copier .env.example en .env}
      FROM_EMAIL: ${FROM_EMAIL:?copier .env.example en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?copier .env.example en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?copier .env.example en .env}
      JWT_SECRET: ${JWT_SECRET:?copier .env.example en .env}
    depends_on:
      db:
        condition: service_healthy
    # Le processus n'écrit aucun fichier : racine en lecture seule.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    # Frontend = Dockerfile à la racine (Vite + nginx). Il cible déjà
    # backend:3007 par défaut (ENV du Dockerfile) : rien à configurer ici.
    build: .
    image: quiz-frontend:local
    ports:
      # Seul port publié : 8087 sur l'hôte -> 8080 (nginx non-root)
      - "8087:8080"
    depends_on:
      backend:
        condition: service_healthy
    # Nginx non-root n'écrit que dans ces trois répertoires (pid, caches,
    # configuration rendue par envsubst) : tout le reste est en lecture seule.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      # propriétaire = uid/gid nginx (101), sinon envsubst ne peut pas écrire
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
